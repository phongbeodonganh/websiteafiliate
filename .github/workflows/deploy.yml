name: Deploy to VPS

on:
  push:
    branches: ['feature/namdt25-develop']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build (catch compile/type errors before touching the VPS)
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/websiteafiliate
            git fetch origin feature/namdt25-develop
            git reset --hard origin/feature/namdt25-develop
            npm install
            npm run build
            pm2 reload websiteafiliate
