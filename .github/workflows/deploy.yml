name: Deploy to VPS

on:
  push:
    branches: ['feature/namdt25-develop']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/websiteafiliate
            git pull origin feature/namdt25-develop
            npm install
            npm run build
            pm2 reload websiteafiliate
